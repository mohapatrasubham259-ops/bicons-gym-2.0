<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Bicon Gym</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
}

.container{
width:90%;
max-width:500px;
background:#222;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(255,60,0,.5);
}

h1{
text-align:center;
margin-bottom:20px;
color:#ff3c00;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#ff3c00;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff5722;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:white;
text-decoration:none;
}

.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
</style>

</head>

<body>

<div class="container">

<h1>Join Bicon Gym</h1>

<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<input type="tel" placeholder="Age" required>

<input type="text mask=##/##/####" placeholder="DOB" required>

<input type="email" placeholder="Email Address" required>


<select required>
<option value="">Select Membership Plan</option>
<option>Joining + Monthly ₹1600 + ₹600</option>
<option>Monthly ₹800</option>
<option>3 Months ₹2400</option>
<option>6 Months ₹4000</option>
</select>

<textarea placeholder="Address"></textarea>

<button type="submit">Submit Registration</button>

</form>

<a href="index.html" class="back">⬅ Back to Home</a>

</div>

</body>
</html>
