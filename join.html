<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Bicon Gym</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:500px;
background:#222;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(255,60,0,.5);
}

h1{
text-align:center;
color:#ff3c00;
margin-bottom:25px;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#ff3c00;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff5a1f;
}

a{
display:block;
text-align:center;
margin-top:20px;
color:white;
text-decoration:none;
}
</style>

</head>
<body>

<div class="container">

<h1>Join Bicon Gym</h1>

<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="email" placeholder="Email">

<input type="number" placeholder="Age">

<select required>
<option>Select Membership</option>
<option>Joining + Monthly (₹1600 + ₹600)</option>
<option>Monthly ₹800</option>
<option>3 Months ₹2400</option>
<option>6 Months ₹4000</option>
</select>

<textarea rows="4" placeholder="Address"></textarea>

<button type="submit">
Submit Registration
</button>

</form>

<a href="index.html">⬅ Back to Home</a>

</div>

</body>
</html>
