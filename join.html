<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Bicon Gym</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
}

.container{
width:90%;
max-width:500px;
background:#222;
padding:30px;
border-radius:15px;
box-shadow:0 0 20px rgba(255,60,0,.5);
}

h1{
text-align:center;
margin-bottom:20px;
color:#ff3c00;
}

input,
select,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#ff3c00;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff5722;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:white;
text-decoration:none;
}

.hero{
    height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
</style>

</head>

<body>

<div class="container">

<h1>Join Bicon Gym</h1>

<form>

<input id="name" type="text" placeholder="Full Name" required>

<input id="phone" type="tel" placeholder="Phone Number" required>

<input id="age" type="number" placeholder="Age" required>

<input id="email" type="email" placeholder="Email Address" required>

<select id="plan" required onchange="updatePlan()">
    <option value="">Select Membership Plan</option>
    <option value="Joining">Joining + Monthly</option>
    <option value="Monthly">Monthly</option>
    <option value="3 Months">3 Months</option>
    <option value="6 Months">6 Months</option>
</select>
<textarea id="address" placeholder="Address"></textarea>


<input id="amount" type="number" placeholder="Amount" readonly>

<input id="paymentDate" type="date" readonly>

<input id="expiryDate" type="date" readonly>

<select id="status">
    <option>Paid</option>
    <option>Pending</option>
</select>

<button type="submit">Submit Registration</button>

</form>

<a href="index.html" class="back">⬅ Back to Home</a>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJ3gjoxKgNTOpLZS-Qg0mrPmp3TVJV7HM",
  authDomain: "bicon-gym.firebaseapp.com",
  projectId: "bicon-gym",
  storageBucket: "bicon-gym.firebasestorage.app",
  messagingSenderId: "64202444264",
  appId: "1:64202444264:web:9e3c1c1519431cdbb5a85d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.updatePlan = function () {

    const plan = document.getElementById("plan").value;
    const amount = document.getElementById("amount");
    const paymentDate = document.getElementById("paymentDate");
    const expiryDate = document.getElementById("expiryDate");

    const today = new Date();

    paymentDate.value = today.toISOString().split("T")[0];

    let expiry = new Date(today);

    if(plan==="Joining"){
        amount.value="1600";
        expiry.setDate(expiry.getDate()+30);
    }else if(plan==="Monthly"){
        amount.value="800";
        expiry.setDate(expiry.getDate()+30);
    }else if(plan==="3 Months"){
        amount.value="2400";
        expiry.setDate(expiry.getDate()+90);
    }else if(plan==="6 Months"){
        amount.value="4000";
        expiry.setDate(expiry.getDate()+180);
    }

    expiryDate.value = expiry.toISOString().split("T")[0];
}

document.querySelector("form").addEventListener("submit", async (e)=>{

    e.preventDefault();

    try{

        const memberData = {

    registrationNo: "BG" + Date.now(),
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    age: document.getElementById("age").value,
    email: document.getElementById("email").value,
    address: document.getElementById("address").value,
    plan: document.getElementById("plan").value,
    amount: document.getElementById("amount").value,

    // Registration के समय payment अभी नहीं हुई है
    paymentDate: "",
    expiryDate: "",
    status: "Pending",

    createdAt: new Date()

};

const docRef = await addDoc(collection(db, "members"), memberData);

alert("Registration Successful!");

// Payment Page Open
window.location.href =
`payment.html?id=${docRef.id}&plan=${encodeURIComponent(memberData.plan)}`;

    }catch(err){

        alert("Error : "+err.message);
        console.log(err);

    }

});
</script>
<script type="module" src="firebase.js"></script>
</body>
</html>
