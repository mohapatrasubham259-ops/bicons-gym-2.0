<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bicon Gym Members</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
}

h1{
    color:#ff3c00;
}

table{
    width:95%;
    margin:20px auto;
    border-collapse:collapse;
}

th,td{
    border:1px solid #444;
    padding:10px;
    text-align:center;
}

th{
    background:#ff3c00;
}

tr:nth-child(even){
    background:#222;
}

tr:nth-child(odd){
    background:#1a1a1a;
}

.Paid {
    color: green;
    font-weight: bold;
}

.Pending {
    color: red;
    font-weight: bold;
}

.modal-box{
    background:#fff;
    color:#000;
    width:320px;
    padding:20px;
    border-radius:10px;
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:8px;
    margin-top:5px;
}

.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:999;
}


.modal-box{
    background:white;
    color:black;
    width:90%;
    max-width:350px;
    padding:20px;
    border-radius:10px;
}

.modal-box select,
.modal-box input,
.modal-box button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

.modal-box{
    background:white;
    color:black;
    width:90%;
    max-width:350px;
    padding:20px;
    border-radius:10px;
    box-sizing:border-box;
}

/* Table Status Colors */
td.status-paid{
    color:#00c853;
    font-weight:bold;
}

td.status-pending{
    color:#8B0000;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
<div style="width:95%;margin:20px auto;">
    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search by Name or Phone..."
        style="width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #555;"
    >
</div>
<h1>Bicon Gym Members</h1>
</header>

<table>

<thead>

<tr>
    <th>Reg No.</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Age</th>
    <th>Plan</th>
    <th>Amount</th>
    <th>Payment Date</th>
    <th>Expiry Date</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="membersTable">

</tbody>

</table>

<!-- Edit Popup -->
<div id="editModal" class="modal">

  <div class="modal-box">

    <h3>Edit Member</h3>

    <label>Plan</label>
   <select id="editPlan">

  <option value="1 Month">1 Month</option>

  <option value="3 Months">3 Months</option>

  <option value="4 Months">4 Months</option>

  <option value="6 Months">6 Months</option>

  <option value="Joining + Monthly">Joining + Monthly</option>

</select>


    <label>Payment Status</label>

<select id="editStatus">
  <option value="Paid">Paid</option>
  <option value="Pending">Pending</option>
</select>>

    <label>Amount</label>
    <input type="number" id="editAmount">

    <button id="saveBtn">Save</button>

    <button onclick="closeModal()">Close</button>

  </div>

</div>

<script type="module" src="members.js"></script>


</body>
</html>
