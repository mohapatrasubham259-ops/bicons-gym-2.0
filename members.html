<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bicon Gym Members</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
}

h1{
    color:#ff3c00;
}

button{
    cursor:pointer;
    padding:10px 15px;
    border:none;
    border-radius:6px;
}
.modal-box button{

    position:relative;

    z-index:10001;

    touch-action:manipulation;

}

#addMemberBtn{
    background:#ff3c00;
    color:white;
    font-size:16px;
}


#searchInput{
    width:95%;
    max-width:500px;
    padding:12px;
    margin-top:15px;
    border-radius:8px;
    border:none;
    font-size:16px;
}


.table-container{
    width:100%;
    overflow-x:auto;
}


table{
    width:95%;
    margin:20px auto;
    border-collapse:collapse;
}


th,td{
    border:1px solid #444;
    padding:10px;
    text-align:center;
}


th{
    background:#ff3c00;
}


tr:nth-child(even){
    background:#222;
}


tr:nth-child(odd){
    background:#1a1a1a;
}



.modal{

    display:none;
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.7);

    justify-content:center;
    align-items:center;

    z-index:9999;

    padding:15px;
    box-sizing:border-box;

}


.modal-box{

    background:white;
    color:black;

    width:95%;
    max-width:350px;

    max-height:90vh;
    overflow-y:auto;

    padding:20px;

    border-radius:10px;

    position:relative;

    z-index:10000;


}


.modal-box{

    background:white;
    color:black;

    width:100%;
    max-width:350px;

    max-height:90vh;
    overflow-y:auto;

    padding:20px;

    border-radius:10px;

    box-sizing:border-box;

}
@media(max-width:600px){

    .modal-box{
        width:95%;
    }


    .modal-box input,
    .modal-box select,
    .modal-box button{

        font-size:16px;
        padding:14px;

    }

}


.modal-box{

    background:white;
    color:black;

    width:90%;
    max-width:350px;

    padding:20px;

    border-radius:10px;

}



.modal-box input,
.modal-box select,
.modal-box button{

    width:100%;

    padding:12px;

    margin-top:10px;

    box-sizing:border-box;

}



.status-paid{

    color:#00c853;
    font-weight:bold;

}


.status-pending{

    color:red;
    font-weight:bold;

}

.status-paid{
    color:#00c853;
    font-weight:bold;
}

.status-pending{
    color:red;
    font-weight:bold;
}

/* Mobile Support */

@media(max-width:600px){

    header{
        padding:15px;
    }


    h1{
        font-size:22px;
    }


    #searchInput{
        width:90%;
    }


    #searchBtn,
    #addMemberBtn{
        width:90%;
        margin-top:10px;
    }


    table{
        font-size:13px;
        min-width:900px;
    }


    th,td{
        padding:8px;
    }


    .modal-box{

        width:85%;
        max-height:90vh;
        overflow-y:auto;

    }


}
</style>

</head>


<body>


<header>

<h1>Bicon Gym Members</h1>


<button id="addMemberBtn">
➕ Add Member
</button>


<input 
id="searchInput"
type="text"
placeholder="Search Name / Phone">


</header>




<div class="table-container">


<table>


<thead>

<tr>

<th>S.No.</th>
<th>Name</th>
<th>Phone</th>
<th>Age</th>
<th>Plan</th>
<th>Amount</th>
<th>Payment</th>
<th>Expiry</th>
<th>Status</th>
<th>Action</th>

</tr>


</thead>


<tbody id="memberTableBody"></tbody>

</table>


</div>





<!-- EDIT POPUP -->


<div id="editModal" class="modal">


<div class="modal-box">


<h2>Edit Member</h2>

<select id="editPlan">
    <option value="Joining">Joining + Monthly</option>
    <option value="Monthly">Monthly</option>
    <option value="3 Months">3 Months</option>
    <option value="6 Months">6 Months</option>
    <option value="12 Months">12 Months</option>
</select>

<input 
type="number"
id="editAmount"
placeholder="Amount">


<select id="editStatus">

<option value="Paid">
Paid
</option>


<option value="Pending">
Pending
</option>


</select>


<button onclick="updateMember()">
Save
</button>



<button onclick="closeModal()">
Cancel
</button>



</div>

</div>







<!-- ADD MEMBER POPUP -->


<div id="addModal" class="modal">


<div class="modal-box">


<h2>Add Member</h2>



<input 
id="newName"
placeholder="Full Name">



<input 
id="newPhone"
placeholder="Phone Number">



<input 
id="newAge"
type="number"
placeholder="Age">



<select id="newPlan">


<option value="">
Select Plan
</option>


<option value="Monthly">
Monthly
</option>


<option value="3 Months">
3 Months
</option>


<option value="6 Months">
6 Months
</option>


<option value="Joining">
Joining + Monthly
</option>


</select>




<input 
id="newAmount"
type="number"
placeholder="Amount">



<input 
id="newPaymentDate"
type="date">



<input 
id="newExpiryDate"
type="date">



<select id="newStatus">


<option value="Paid">
Paid
</option>


<option value="Pending">
Pending
</option>


</select>





<button id="addSaveBtn">
Save
</button>


<button onclick="closeAddModal()">
Cancel
</button>



</div>

</div>





<script type="module" src="members.js"></script>


</body>

</html>
