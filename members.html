<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bicon Gym Members</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
}

h1{
    margin:0;
}


.container{
    padding:20px;
}


button{
    background:#00c853;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}


.search{
    margin:15px 0;
}

input,select{
    padding:10px;
    width:100%;
    margin:5px 0;
    border-radius:5px;
    border:none;
}


table{
    width:100%;
    border-collapse:collapse;
    background:#222;
}


th,td{
    padding:10px;
    border:1px solid #444;
    text-align:center;
}


th{
    background:#000;
}


.paid{
    color:#00ff66;
    font-weight:bold;
}


.pending{
    color:#ff3333;
    font-weight:bold;
}



.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#000b;
    justify-content:center;
    align-items:center;
}


.box{
    background:#222;
    padding:20px;
    width:350px;
    border-radius:10px;
}


.close{
    background:red;
}


@media(max-width:700px){

table{
    font-size:12px;
}

.container{
    overflow-x:auto;
}

}

</style>

</head>


<body>


<header>
<h1>Bicon Gym Members</h1>
</header>


<div class="container">


<button onclick="openAdd()">+ Add Member</button>


<div class="search">
<input 
id="searchBox"
placeholder="Search Name or Phone"
onkeyup="searchMember()">
</div>



<table>

<thead>

<tr>

<th>Reg No</th>
<th>Name</th>
<th>Phone</th>
<th>Age</th>
<th>Plan</th>
<th>Amount</th>
<th>Payment</th>
<th>Expiry</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>


<tbody id="memberTable">

</tbody>


</table>


</div>




<!-- ADD / EDIT POPUP -->

<div class="popup" id="popup">


<div class="box">


<h2 id="formTitle">
Add Member
</h2>


<input id="name" placeholder="Name">

<input id="phone" placeholder="Phone">

<input id="age" placeholder="Age">


<select id="plan">

<option value="1 Month">
1 Month
</option>

<option value="3 Month">
3 Month
</option>

<option value="6 Month">
6 Month
</option>

</select>



<input id="amount" placeholder="Amount">


<label>Payment Date</label>
<input type="date" id="paymentDate">


<label>Expiry Date</label>
<input type="date" id="expiryDate">



<button onclick="saveMember()">
Save
</button>


<button class="close" onclick="closePopup()">
Close
</button>


</div>


</div>





<script type="module" src="members.js"></script>


</body>

</html>
