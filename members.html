<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bicon Gym Members</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#000;
    padding:20px;
    text-align:center;
}

h1{
    color:#ff3c00;
}

table{
    width:95%;
    margin:20px auto;
    border-collapse:collapse;
}

th,td{
    border:1px solid #444;
    padding:10px;
    text-align:center;
}

th{
    background:#ff3c00;
}

tr:nth-child(even){
    background:#222;
}

tr:nth-child(odd){
    background:#1a1a1a;
}
</style>

</head>

<body>

<header>
<div style="width:95%;margin:20px auto;">
    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search by Name or Phone..."
        style="width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #555;"
    >
</div>
<h1>Bicon Gym Members</h1>
</header>

<table>

<thead>

<tr>
    <th>Reg No.</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Age</th>
    <th>Plan</th>
    <th>Amount</th>
    <th>Payment Date</th>
    <th>Expiry Date</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="membersTable">

</tbody>

</table>

<script type="module" src=".members.js"></script>
</body>
</html>
